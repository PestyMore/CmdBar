name: Build CmdBar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub 托管 runner 可直连 npm / crates.io，因此不配置任何代理。
# 若改用自托管 runner 且需要代理，在 job 上加 env: HTTP_PROXY / HTTPS_PROXY 即可。

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 便携版 + NSIS 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 检查 Rust 格式
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: 类型检查与前端构建
        run: npm run build

      - name: 构建安装包
        shell: pwsh
        run: |
          for ($i = 1; $i -le 2; $i++) {
            npx tauri build --bundles nsis
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 2) { exit 1 }
            Write-Output '构建失败，15 秒后重试（NSIS 依赖下载可能超时）'
            Start-Sleep -Seconds 15
          }

      - name: 整理产物
        shell: pwsh
        run: |
          # rust-cache 可能恢复旧版安装包，按当前版本号精确取文件，避免把陈旧产物一起上传
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item src-tauri/target/release/cmdbar.exe release-artifacts/CmdBar-portable.exe
          Copy-Item "src-tauri/target/release/bundle/nsis/CmdBar_${version}_x64-setup.exe" release-artifacts/

      - name: 隐私检查
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Recurse -File release-artifacts)
          $forbidden = @($files | Where-Object { $_.Name -match 'commands\.json|\.env|\.db$|\.sqlite$|\.bak$' })
          if ($forbidden.Count -gt 0) {
            throw "产物中包含数据文件: $($forbidden.FullName -join ', ')"
          }
          if ($files.Count -ne 2) { throw "产物数量异常: $($files.Count)" }
          $files | ForEach-Object { Write-Output "OK $($_.Name) $($_.Length) bytes" }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CmdBar-Windows-${{ github.sha }}
          if-no-files-found: error
          path: release-artifacts/*

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
