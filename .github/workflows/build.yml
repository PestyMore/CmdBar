name: Build CmdBar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub 托管 runner 可直连 npm / crates.io，因此不配置任何代理。
# 若改用自托管 runner 且需要代理，在 job 上加 env: HTTP_PROXY / HTTPS_PROXY 即可。

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS 安装包
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 配置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: npm ci

      - name: 检查 Rust 格式
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: 类型检查与前端构建
        run: npm run build

      - name: 构建安装包
        run: npx tauri build --bundles nsis

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: CmdBar-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
